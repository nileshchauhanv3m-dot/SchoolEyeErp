name: SchoolEye Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SchoolEye.sln

      - name: Build
        run: dotnet build SchoolEye.sln --configuration Release --no-restore

      - name: Publish API
        run: |
          dotnet publish ServerWebAPI/ServerWebAPI.csproj `
          -c Release `
          -o D:\Application\SchoolEye2.0

      - name: Publish UI
        run: |
          dotnet publish ServerWebUI/ServerWebUI.csproj `
          -c Release `
          -o D:\Application\SchoolEyeUI2.0

      - name: Restart API App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Restart-WebAppPool SchoolEye2_API

      - name: Restart UI App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Restart-WebAppPool SchoolEye2_UI